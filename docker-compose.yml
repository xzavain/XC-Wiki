name: xc-wiki

services:
  xc-wiki:
    build: .
    container_name: xc-wiki
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
    volumes:
      - xcwiki-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/settings/public').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  xcwiki-data:
