services:
  xc-wiki:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    # Set these in your .env file (plain Compose) or in Coolify's
    # Environment Variables UI — they are passed into the container here.
    environment:
      # App always listens on 3000 inside the container; ${PORT} above
      # controls the host-side port only.
      PORT: 3000
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY (openssl rand -hex 32) - it encrypts cloud-backup credentials and must never change once set}
    volumes:
      # SQLite database + uploads persist here across restarts/upgrades
      - xcwiki-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/settings/public').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  xcwiki-data:
