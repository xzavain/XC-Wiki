<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="XC Wiki Knowledge Base">
<title>XC Wiki Knowledge Base</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div id="preview-banner" class="preview-banner hidden">
  <span>You are viewing the Knowledge Base as a customer. Live readers are unchanged.</span>
  <button id="preview-exit" class="link-btn">Back to staff dashboard</button>
</div>

<header class="topbar">
  <a href="#/" class="brand" id="brand-link">
    <span class="brand-mark" id="brand-mark">XC</span>
    <span class="brand-text"><strong id="brand-title">XC Wiki</strong><small id="brand-tagline">Knowledge Base</small></span>
  </a>
  <button class="search-trigger" id="search-trigger" aria-label="Search">
    <span class="search-icon">⌕</span>
    <span class="search-ph">Search guides, setup instructions, troubleshooting and more…</span>
    <kbd>Ctrl K</kbd>
  </button>
  <div class="topbar-right">
    <div class="theme-toggle" role="group" aria-label="Theme">
      <button data-theme-set="light">Light</button>
      <button data-theme-set="dark">Dark</button>
      <button data-theme-set="system" class="active">System</button>
    </div>
    <div id="user-area"></div>
  </div>
  <button class="nav-toggle" id="nav-toggle" aria-label="Menu">☰</button>
</header>

<nav class="mainnav" id="mainnav">
  <a href="#/" data-nav="overview">Overview ▾</a>
  <a href="#/services" data-nav="services">Your Services ▾</a>
  <a href="#/services" data-nav="all-services">All Services ▾</a>
  <div class="nav-drop">
    <button data-nav="resources">Resources ▾</button>
    <div class="nav-drop-menu">
      <a href="#/categories">All Categories</a>
      <a href="#/tags">All Tags</a>
      <a href="#/popular">Popular Guides</a>
      <a href="#/recent">Recently Updated</a>
    </div>
  </div>
</nav>

<main id="app" class="container"></main>

<footer class="footer">
  <div class="container">
    <span id="footer-text">© 2026 XC Wiki. All rights reserved.</span>
    <span class="footer-links"><a href="#/categories">Categories</a> · <a href="#/tags">Tags</a> · <a href="#/popular">Popular</a> · <a href="#/login" class="footer-admin">Admin</a></span>
  </div>
</footer>

<div id="search-modal" class="modal hidden">
  <div class="modal-box search-box">
    <div class="search-input-row">
      <span>⌕</span>
      <input id="search-input" type="text" placeholder="Search documentation…" autocomplete="off">
      <button class="icon-btn" id="search-close">✕</button>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="/js/app.js"></script>
<script src="/js/wysiwyg.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
